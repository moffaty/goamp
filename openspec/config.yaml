schema: spec-driven

context: |
  GOAMP — Winamp-inspired music player. Tauri (Rust backend) + TypeScript/vitest
  frontend + Go sidecar (goamp-node) for P2P (libp2p, GossipSub, DHT).
  Modular "framework not app" architecture: GoampCore fluent builder
  (.renderer().transport().source().feature().start()); modules implement
  IRenderer/ISource/IFeature and receive ModuleContext (ctx.player, ctx.events,
  ctx.ui, ctx.storage, ctx.transport). Frontend routes through a typed service
  layer — never direct invoke(). Testing: frontend Tauri-free via MockTransport;
  Rust via in-memory SQLite (crate::db::test_db()). Conventions: master branch,
  feature branches only, no Co-Authored-By trailer, commit after approval.
  Ponytail mode: laziest solution that works, stdlib-first, fewest files.

