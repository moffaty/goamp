name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev

      - name: Install Go (sidecar)
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build Go sidecar (goamp-node)
        shell: bash
        working-directory: goamp-node
        run: |
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)    GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../src-tauri/binaries/goamp-node-${{ matrix.target }}.exe ./cmd/goamp-node ;;
            aarch64-apple-darwin)      GOOS=darwin  GOARCH=arm64                go build -o ../src-tauri/binaries/goamp-node-${{ matrix.target }}      ./cmd/goamp-node ;;
            x86_64-unknown-linux-gnu)  GOOS=linux   GOARCH=amd64                go build -o ../src-tauri/binaries/goamp-node-${{ matrix.target }}      ./cmd/goamp-node ;;
          esac

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GOAMP ${{ github.ref_name }}"
          releaseBody: |
            See the assets below to download GOAMP for your platform.

            **Downloads:**
            - `.msi` / `.nsis` — Windows
            - `.dmg` — macOS
            - `.deb` / `.AppImage` — Linux
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
